              <h3>友達なのに、なんだか疲れる？</h3>
              <p>「フレネミー」は、友達のように接しながら、競争心や敵意のある振る舞いをする相手を指して使われる言葉です。ただ、一度の発言やこの診断だけで、相手を決めつけることはできません。</p>
              <p>一緒にいるときに自分が何度も傷ついたり、無理をしたりしていないか、自分の気持ちを振り返ってみましょう。必要なら少し距離を置いたり、信頼できる人に話したりしても大丈夫です。</p>
              <p class="small-note">この読み物は8タイプ共通です。特定の友達を判定するものではありません。</p>
            </div>
          </details>
        </section>
      `;
      document.getElementById("btnShare").onclick = async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: SITE.title, text, url });
            return;
          } catch (_) {}
        }
        document.getElementById("sharePanel").scrollIntoView({ behavior: "smooth", block: "center" });
        toast("シェア方法を選んでね");
      };
      document.getElementById("btnCopy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(`${text}\n\n${url}`);
          toast("シェア文をコピーしました");
        } catch (_) {
          const textarea = document.createElement("textarea");
          textarea.value = `${text}\n\n${url}`;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          try { document.execCommand("copy"); toast("シェア文をコピーしました"); }
          catch (e) { toast("コピーできませんでした"); }
          textarea.remove();
        }
      };
      const nativeBtn = document.getElementById("btnNative");
      if (navigator.share) {
        nativeBtn.hidden = false;
        nativeBtn.onclick = async () => {
          try { await navigator.share({ title: SITE.title, text, url }); } catch (_) {}
        };
      }
      document.getElementById("btnTypesFromResult").onclick = () => setStep("types");
      document.getElementById("btnAgain").onclick = () => resetAll();
    }
    function renderTypes() {
      const cards = Object.entries(TYPES).map(([key, type]) => `
        <article class="type-card" style="--accent:${esc(type.accent)}">
          <img src="${esc(type.image)}" alt="${esc(type.imageAlt)}" loading="lazy" decoding="async" width="900" height="900">
          <div class="type-body">
            <p class="type-code">TYPE ${esc(type.no)} / ${esc(formatKey(key))}</p>
            <h3>${esc(type.name)}</h3>
            <p>${esc(type.catch)}</p>
          </div>
        </article>
      `).join("");
      app.innerHTML = `
        <section class="stage fade-in">
          <p class="kicker">8 FRIENDSHIP TYPES</p>
          <h2 class="section-title">あなたはどのタイプ？</h2>
          <p class="text">結果を見せ合うと、似ているところや違いが面白いかも。気になるタイプから話してみてね。</p>
          <div class="types-grid">${cards}</div>
          <div class="actions types-actions">
            <button class="btn primary" id="btnTypesStart" type="button">${isComplete() ? "結果に戻る" : "診断スタート"}</button>
            <button class="btn" id="btnTypesHome" type="button">トップへ</button>
          </div>
        </section>
      `;
      document.getElementById("btnTypesStart").onclick = () => {
        state.step = isComplete() ? "result" : (Object.keys(state.answers).length ? "quiz" : "intro");
        saveState();
        render();
      };
      document.getElementById("btnTypesHome").onclick = () => setStep("intro");
    }
    document.getElementById("navDiagnosis").onclick = (event) => {
      event.preventDefault();
      if (isComplete()) state.step = "result";
      else if (Object.keys(state.answers).length) state.step = "quiz";
      else state.step = "intro";
      saveState();
      render();
    };
    document.getElementById("navTypes").onclick = (event) => {
      event.preventDefault();
      setStep("types");
    };
    document.getElementById("btnReset").onclick = resetAll;
    window.MobbyKatoYuri = { computeResult, QUESTIONS, TYPES, state, render };
    loadState();
    render();
  </script>
</body>
</html>
